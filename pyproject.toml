[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rember"
version = "0.2.0"
description = "A modular RAG pipeline that remembers everything you feed it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "rember" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings[yaml]>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "google-genai>=1.0.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "ffmpeg-python>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]
whisper = ["openai-whisper>=20231117"]

[project.scripts]
rember = "rember.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rember"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "-q", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests (require API keys)",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
